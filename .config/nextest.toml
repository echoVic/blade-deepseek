[profile.ci]
default-filter = "not (binary(=orca_tui) | binary(=tui_pty_contract))"
fail-fast = false
test-threads = 4
slow-timeout = { period = "60s", terminate-after = 2 }

[[profile.ci.overrides]]
filter = "package(=orca-runtime) & test(/^runtime_host::tests::(capability_mark_rails|older_incomplete_background_completion)/)"
threads-required = 4

[[profile.ci.overrides]]
filter = "package(=orca-tools) & test(/^external::tests::external_tool_timeout_/)"
threads-required = 4
