name: Verify release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Published version to verify, without leading v"
        required: true

permissions:
  contents: read

jobs:
  verify-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v${{ inputs.version }}
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Smoke the published Windows npm package
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP "orca-npm-smoke"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Set-Content -Path (Join-Path $root "package.json") -Value '{"private":true}'
          Push-Location $root
          npm install --ignore-scripts --save-exact "@blade-ai/orca@${{ inputs.version }}"
          node (Join-Path $root "node_modules/@blade-ai/orca/bin/orca.js") --version
          Pop-Location
      - name: Smoke the published PowerShell installer
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP "orca-installer-smoke"
          & ./install.ps1 `
            -Repo "${{ github.repository }}" `
            -Version "${{ inputs.version }}" `
            -InstallDir (Join-Path $root "bin") `
            -NonInteractive
      - name: Smoke the installed native Windows runner and sandbox lifecycle
        shell: powershell
        run: |
          $OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $root = Join-Path $env:RUNNER_TEMP "orca-native-helper-smoke"
          $installDir = Join-Path (Join-Path $env:RUNNER_TEMP "orca-installer-smoke") "bin"
          $runner = Join-Path $installDir "orca-windows-runner.exe"
          $setup = Join-Path $installDir "orca-windows-sandbox-setup.exe"
          $workspace = Join-Path $root "workspace"
          $stateDir = Join-Path $root "state"
          New-Item -ItemType Directory -Force -Path $workspace | Out-Null
          New-Item -ItemType Directory -Force -Path $stateDir | Out-Null

          $runnerRequest = @{
            version = 1
            program = $env:ComSpec
            args = @("/D", "/S", "/C", "echo orca-runner-release-smoke")
            cwd = (Get-Location).Path
            env = @{}
            job_name = $null
            forward_stdin = $false
          } | ConvertTo-Json -Compress
          $runnerResponseText = $runnerRequest | & $runner
          if ($LASTEXITCODE -ne 0) { throw "native Windows runner exited with code ${LASTEXITCODE}: $runnerResponseText" }
          $runnerResponse = $runnerResponseText | ConvertFrom-Json
          if (-not $runnerResponse.ok -or $runnerResponse.exit_code -ne 0) {
            throw "native Windows runner smoke failed: $runnerResponseText"
          }
          $runnerOutput = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($runnerResponse.stdout_base64))
          if ($runnerOutput -notmatch "orca-runner-release-smoke") {
            throw "native Windows runner did not return captured child output"
          }

          function Invoke-SandboxSetup([string]$Operation) {
            $request = @{
              version = 1
              operation = $Operation
              state_dir = $stateDir
              workspace = $workspace
            } | ConvertTo-Json -Compress
            $responseText = $request | & $setup
            if ($LASTEXITCODE -ne 0) { throw "sandbox setup '$Operation' exited with code $($LASTEXITCODE): $responseText" }
            $response = $responseText | ConvertFrom-Json
            if (-not $response.ok) { throw "sandbox setup '$Operation' failed: $responseText" }
            return $response
          }

          $provision = Invoke-SandboxSetup "provision"
          if (-not $provision.receipt) { throw "sandbox provision did not return a receipt" }
          $check = Invoke-SandboxSetup "check"
          if (-not $check.receipt) { throw "sandbox check did not return a receipt" }
          $repair = Invoke-SandboxSetup "repair"
          if (-not $repair.receipt) { throw "sandbox repair did not return a receipt" }
          $remove = Invoke-SandboxSetup "remove"
          if (-not $remove.removed) { throw "sandbox remove did not revoke the workspace capability" }
      - name: Verify the published Windows archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP "orca-release-smoke"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          gh release download "v${{ inputs.version }}" --repo "${{ github.repository }}" --pattern "orca-${{ matrix.target }}.zip" --pattern "orca-${{ matrix.target }}.zip.sha256" --dir $root
          $archive = Join-Path $root "orca-${{ matrix.target }}.zip"
          $expected = ((Get-Content ("$archive.sha256") -Raw).Trim() -split "\s+")[0].ToLowerInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "Windows release checksum mismatch" }
          Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $root "extract") -Force
          foreach ($member in @("orca-windows-runner.exe", "orca-windows-sandbox-setup.exe", "LICENSE")) {
            if (-not (Test-Path (Join-Path $root "extract/$member") -PathType Leaf)) {
              throw "Windows release bundle is missing $member"
            }
          }
          & (Join-Path $root "extract/orca.exe") --version
