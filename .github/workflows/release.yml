name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to validate, without leading v"
        required: true
        default: "0.1.0"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install test runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - name: Run tests
        env:
          RUST_BACKTRACE: "1"
        run: cargo test --workspace --all-targets --locked -- --test-threads=1

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Verify repository version sync
        run: node scripts/release/verify-version-sync.mjs
      - id: version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${DISPATCH_VERSION}"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release version '$version' is not a valid semver release version" >&2
            exit 1
          fi

          cargo_version="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')"
          if [[ "$version" != "$cargo_version" ]]; then
            echo "Release version $version does not match Cargo.toml version $cargo_version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: [test, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux ARM64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir -p "dist/orca-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/orca" "dist/orca-${{ matrix.target }}/orca"
          tar -C "dist/orca-${{ matrix.target }}" -czf "dist/orca-${{ matrix.target }}.tar.gz" orca
          shasum -a 256 "dist/orca-${{ matrix.target }}.tar.gz" > "dist/orca-${{ matrix.target }}.tar.gz.sha256"
      - uses: actions/upload-artifact@v5
        with:
          name: orca-${{ matrix.target }}
          path: |
            dist/orca-${{ matrix.target }}/orca
            dist/orca-${{ matrix.target }}.tar.gz
            dist/orca-${{ matrix.target }}.tar.gz.sha256

  npm-auth:
    if: github.ref_type == 'tag'
    needs: [version]
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Require live npm credentials
        run: |
          test -n "$NODE_AUTH_TOKEN" || { echo "NPM_TOKEN is required" >&2; exit 1; }
          npm whoami

  release:
    if: github.ref_type == 'tag'
    needs: [build, version, npm-auth]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist/artifacts
          merge-multiple: true
      - name: Collect release assets
        shell: bash
        run: |
          mkdir -p dist/release
          find dist/artifacts -name '*.tar.gz' -exec cp {} dist/release/ \;
          find dist/artifacts -name '*.sha256' -exec cp {} dist/release/ \;
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Orca ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/release/*

  npm:
    if: github.ref_type == 'tag'
    needs: [build, version, release, npm-auth]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v5
        with:
          path: dist/artifacts
          merge-multiple: true
      - name: Stage npm packages
        run: |
          node scripts/release/stage-npm.mjs \
            --version "${{ needs.version.outputs.version }}" \
            --artifacts-dir dist/artifacts \
            --out-dir dist/npm \
            --pack
      - name: Smoke current platform npm package
        run: |
          node scripts/release/smoke-npm.mjs \
            --version "${{ needs.version.outputs.version }}" \
            --stage-dir dist/npm/stage \
            --tarballs-dir dist/npm/tarballs
      - name: Upload npm tarballs artifact
        uses: actions/upload-artifact@v5
        with:
          name: npm-tarballs
          path: dist/npm/tarballs/*.tgz
      - name: Publish npm packages
        shell: bash
        run: |
          version="${{ needs.version.outputs.version }}"
          tarballs=(
            "dist/npm/tarballs/blade-ai-orca-${version}-darwin-arm64.tgz" \
            "dist/npm/tarballs/blade-ai-orca-${version}-darwin-x64.tgz" \
            "dist/npm/tarballs/blade-ai-orca-${version}-linux-arm64.tgz" \
            "dist/npm/tarballs/blade-ai-orca-${version}-linux-x64.tgz" \
            "dist/npm/tarballs/blade-ai-orca-${version}.tgz"
          )
          declare -A existing
          for tarball in "${tarballs[@]}"; do
            test -f "$tarball"
            package_version="$(tar -xOf "$tarball" package/package.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).version))')"
            local_integrity="sha512-$(node -e 'const fs=require("fs"),c=require("crypto");process.stdout.write(c.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64"))' "$tarball")"
            set +e
            registry_output="$(npm view "@blade-ai/orca@${package_version}" dist.integrity --json 2>&1)"
            registry_status=$?
            set -e
            if [[ $registry_status -eq 0 ]]; then
              registry_integrity="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]))' "$registry_output")"
              if [[ "$registry_integrity" != "$local_integrity" ]]; then
                echo "@blade-ai/orca@${package_version} exists with different registry integrity" >&2
                exit 1
              fi
              existing["$package_version"]=1
            elif [[ "$registry_output" != *E404* ]]; then
              echo "$registry_output" >&2
              exit "$registry_status"
            fi
          done
          for tarball in "${tarballs[@]}"; do
            package_version="$(tar -xOf "$tarball" package/package.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).version))')"
            if [[ "${existing[$package_version]:-}" = 1 ]]; then
              echo "@blade-ai/orca@${package_version} already published with identical integrity"
              continue
            fi
            tag=latest
            [[ "$package_version" == *-* ]] && tag=native
            npm publish "$tarball" --access public --tag "$tag"
          done

  npm-release-assets:
    if: ${{ always() && github.ref_type == 'tag' && needs.npm.result == 'success' }}
    needs: [npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: npm-tarballs
          path: dist/npm/tarballs
      - name: Upload npm tarballs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/npm/tarballs/*.tgz

  verify:
    if: ${{ always() && github.ref_type == 'tag' }}
    needs: [version, release, npm, npm-release-assets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require every publication rail
        env:
          RELEASE_RESULT: ${{ needs.release.result }}
          NPM_RESULT: ${{ needs.npm.result }}
          ASSETS_RESULT: ${{ needs.npm-release-assets.result }}
        run: |
          test "$RELEASE_RESULT" = success
          test "$NPM_RESULT" = success
          test "$ASSETS_RESULT" = success
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Verify public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release/verify-published.mjs \
            --version "${{ needs.version.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --package "@blade-ai/orca" \
            --bin "orca"
